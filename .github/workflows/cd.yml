name: Continuous Delivery

# Runs CI once, then deploys the artifact to environments selected by the pushed branch.

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']

jobs:
  ci:
    name: Continuous Integration
    permissions:
      contents: read
    uses: ./.github/workflows/ci-tasks.yml
    # Reusable workflows receive no secrets unless they are passed explicitly.
    secrets: inherit

  deploy:
    name: Deploy to ${{ matrix.environment }}
    needs: [ci]
    # A matrix over an empty array errors, so skip the job when no target is enabled.
    if: ${{ needs.ci.outputs.deployment_targets != '[]' }}
    strategy:
      # One environment failing must not cancel deployments to the others.
      fail-fast: false
      matrix:
        # CI returns the environments this branch is allowed to deploy to.
        environment: ${{ fromJSON(needs.ci.outputs.deployment_targets) }}
    # Self-hosted runner: deployment targets are not reachable from hosted runners.
    runs-on:
      labels: pg-pgi-4gb-1cpu
      # DR deployments run on the DR runner group.
      group: ${{ matrix.environment == 'prod_dr' && 'devx-pgi-dr' || 'devx-pgi' }}
    # Binds the job to the GitHub Environment holding the approval gate and its vars.
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      # Required to mint the OIDC token used for passwordless Azure login.
      id-token: write
      actions: read
      deployments: write
    steps:
      # Federated credential exchange - no client secret is stored in the repository.
      - name: Azure Login (OIDC)
        uses: procter-gamble/da-pp-pda-github-actions/composite/azure/azurelogin@2edcb2ed8466782ad3b662b0e3d58c30a744236d # main
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Deploys the exact artifact CI built, so released bits are the tested bits.
      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: artifact-${{ github.run_id }}-${{ github.sha }}

      - name: Deploy application
        shell: pwsh
        run: |
          Write-Host "Deploying Function App to ${{ matrix.environment }}: ${{ vars.FUNCTION_APP_NAME }}"
          az functionapp deployment source config-zip `
            --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}" `
            --name "${{ vars.FUNCTION_APP_NAME }}" `
            --resource-group "${{ vars.RESOURCE_GROUP }}" `
            --src "app-${{ github.run_id }}-${{ github.sha }}.zip"

      - name: Publish deployment summary
        if: ${{ always() }}
        shell: pwsh
        env:
          ENVIRONMENT: ${{ matrix.environment }}
          TARGET_SERVICE: ${{ vars.FUNCTION_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          VERSION: ${{ needs.ci.outputs.semver }}
          INITIATOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $lines = @(
            "## Deployment summary"
            ""
            "| Field | Value |"
            "| --- | --- |"
            "| Environment | $env:ENVIRONMENT |"
            "| Target service | $env:TARGET_SERVICE |"
            "| Resource group | $env:RESOURCE_GROUP |"
            "| Subscription | $env:SUBSCRIPTION |"
            "| Version | $env:VERSION |"
            "| Initiator | $env:INITIATOR |"
            "| Event | $env:EVENT |"
            "| Branch | $env:REF_NAME |"
            "| Commit | $env:COMMIT |"
            "| Status | $env:JOB_STATUS |"
          )
          ($lines -join "`n") | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8